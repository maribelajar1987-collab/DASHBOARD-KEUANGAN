
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Pertama Saya</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            text-align: center;
            padding: 50px 20px;
        }

        .kartu {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            margin: auto;
            box-shadow: 0 4px 15px #0001;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="kartu">
        <h1>Halo, Selamat Datang!</h1>
        <p>Ini adalah aplikasi pertama saya.</p>

        <button onclick="alert('Aplikasi berhasil dijalankan!')">
            Klik Saya
        </button>
    </div>

</body>
</html>
